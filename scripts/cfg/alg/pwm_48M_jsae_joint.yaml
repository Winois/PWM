_target_: pwm.algorithms.pwm_joint_latent_wm.PWM
_recursive_: False
actor_config:
  _target_: pwm.models.actor.ActorStochasticMLP
  units: [400, 200, 100]
  activation_class: nn.Mish
  init_gain: 1.0
  init_logstd: -1.0
  min_logstd: -1.427
jsae_config:
  _target_: pwm.models.actor.JointStateActionAutoEncoder
  latent_action_dim: 6 #16 #64
  units: [512, 256]
  activation_class: nn.Mish
  # joint latent-action WM mode
critic_config:
  _target_: pwm.models.critic.CriticMLP
  units: [400, 200]
  activation_class: nn.Mish
world_model_config:
  _target_: pwm.models.world_model.WorldModel
  units: [1792, 1792]
  encoder_units: [1792, 1792, 1792]
  num_bins: 101
  vmin: -10.0
  vmax: 10.0
  task_dim: 96
  multitask: True
  action_dims: ???
  tasks: ???
  encoder:
    last_layer: normedlinear
    last_layer_kwargs:
      act:
        _target_: pwm.models.mlp.SimNorm
        simnorm_dim: 8
  dynamics:
    last_layer: normedlinear
    last_layer_kwargs:
      act:
        _target_: pwm.models.mlp.SimNorm
        simnorm_dim: 8
  reward:
    last_layer: linear
    last_layer_kwargs: {}
num_critics: 3
latent_dim: 768
actor_lr: 1e-4
critic_lr: 5e-4
model_lr: 1e-4 #3e-4
jsae_lr: 2e-3  #3e-4
jsae_loss_denom_min: 1e-6
lr_schedule: linear
obs_rms: False
rew_rms: False
ret_rms: True
critic_iterations: 8
critic_batches: 4
critic_method: td-lambda
lam: 0.95
gamma: 0.99
max_epochs: 2
horizon: ${horizon}
actor_grad_norm: 1.0
critic_grad_norm: 100.0
wm_batch_size: 256
wm_iterations: 5
wm_grad_norm: 20.0
wm_buffer_size: 1_000_000
detach: True
save_interval: 2500
device: ${general.device}

jsae_frozen: false
jsae_pretrained_checkpoint: null
#joint_latent_wm: true